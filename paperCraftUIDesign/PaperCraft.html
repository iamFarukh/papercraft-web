<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440, initial-scale=1" />
<title>PaperCraft — Academic Operating System</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="styles.css" />

<style>
  html, body { margin: 0; padding: 0; background: #efece5; font-family: 'Geist', system-ui, sans-serif; color: #15161A; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens/shared.jsx"></script>
<script type="text/babel" src="screens/ControlCenter.jsx"></script>
<script type="text/babel" src="screens/Repository.jsx"></script>
<script type="text/babel" src="screens/PaperBuilder.jsx"></script>
<script type="text/babel" src="screens/Approval.jsx"></script>
<script type="text/babel" src="screens/GenerateFlow.jsx"></script>
<script type="text/babel" src="screens/Curriculum.jsx"></script>
<script type="text/babel" src="screens/BulkUpdate.jsx"></script>
<script type="text/babel" src="screens/BulkUpload.jsx"></script>
<script type="text/babel" src="screens/RepositoryV2.jsx"></script>
<script type="text/babel" src="screens/PaperBuilderV2.jsx"></script>
<script type="text/babel" src="screens/Blueprints.jsx"></script>
<script type="text/babel" src="screens/Templates.jsx"></script>
<script type="text/babel" src="screens/PaperEditor.jsx"></script>
<script type="text/babel" src="screens/PaperEditorScreens.jsx"></script>
<script type="text/babel" src="screens/AccountScreens.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "canvas": "classic"
  }/*EDITMODE-END*/;

  const App = () => {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

    return (
      <>
        <DesignCanvas>
          <DCSection id="admin" title="Admin · The Operator's View" subtitle="Six surfaces that compose the operational backbone of a school's examination workflow. Light theme, editorial type, premium spacing.">
            <DCArtboard id="control" label="① Academic Control Center" width={1440} height={1000}>
              <ControlCenter />
            </DCArtboard>
            <DCArtboard id="repo" label="② Question Repository · Workspace" width={1440} height={1000}>
              <Repository />
            </DCArtboard>
            <DCArtboard id="builder" label="③ Paper Builder · Composition Canvas" width={1440} height={1100}>
              <PaperBuilder tweaks={t} />
            </DCArtboard>
          </DCSection>

          <DCSection id="review" title="Approval &amp; Composition" subtitle="The dual screens where admins keep quality high and teachers compose with confidence.">
            <DCArtboard id="approval" label="④ Approval Workspace · Review Environment" width={1440} height={1100}>
              <Approval />
            </DCArtboard>
            <DCArtboard id="generate" label="⑤ Generate Paper · Teacher Flow" width={1440} height={1000}>
              <GenerateFlow />
            </DCArtboard>
            <DCArtboard id="curriculum" label="⑥ Curriculum Workspace" width={1440} height={1000}>
              <Curriculum />
            </DCArtboard>
          </DCSection>

          <DCSection id="bulk" title="Bulk Update · 5-step flow" subtitle="An admin selects 47 questions in the Quadratic Equations chapter and bulk-edits four fields. Each artboard is one step of the wizard — selection → scope → values → preview → done.">
            <DCArtboard id="bulk-1" label="① Select · 47 questions in Repository" width={1440} height={1000}>
              <BulkSelectRepo />
            </DCArtboard>
            <DCArtboard id="bulk-2" label="② Scope · pick fields to change" width={1440} height={1000}>
              <BulkScope />
            </DCArtboard>
            <DCArtboard id="bulk-3" label="③ Set values · configure each change" width={1440} height={1000}>
              <BulkValues />
            </DCArtboard>
            <DCArtboard id="bulk-4" label="④ Preview · diff + conflicts" width={1440} height={1000}>
              <BulkPreview />
            </DCArtboard>
            <DCArtboard id="bulk-5" label="⑤ Complete · undo + audit" width={1440} height={900}>
              <BulkComplete />
            </DCArtboard>
          </DCSection>

          <DCSection id="csv" title="Bulk CSV Upload · 5-step import" subtitle="A school migrates an RBSE Class VI–VIII Mathematics question bank. 99 rows arrive — 84 valid, 12 warnings, 3 failed — 96 import as Draft. Every step below.">
            <DCArtboard id="csv-1" label="① Upload · drop zone + template" width={1440} height={1000}>
              <CsvUpload />
            </DCArtboard>
            <DCArtboard id="csv-2" label="② Map columns · CSV → PaperCraft" width={1440} height={1050}>
              <CsvMap />
            </DCArtboard>
            <DCArtboard id="csv-3" label="③ Validate · row-by-row preview" width={1440} height={1100}>
              <CsvValidate />
            </DCArtboard>
            <DCArtboard id="csv-4" label="④ Summary · pre-commit confirmation" width={1440} height={1050}>
              <CsvSummary />
            </DCArtboard>
            <DCArtboard id="csv-5" label="⑤ Complete · imported as Draft" width={1440} height={1100}>
              <CsvComplete />
            </DCArtboard>
          </DCSection>
          <DCSection id="repo-v2" title="Question Repository · redesign" subtitle="Matches the live product UI — Smart filters sidebar (syllabus tree + difficulty/type/status pills), selection action bar, proper Grid/List segmented control, RBSE-flavoured cards, and the Question Detail modal as a separate artboard.">
            <DCArtboard id="repo-v2-main" label="Question Repository v2 · main" width={1440} height={1000}>
              <RepositoryV2 />
            </DCArtboard>
            <DCArtboard id="repo-v2-modal" label="Question Detail · modal" width={1440} height={1000}>
              <RepositoryV2 withModal />
            </DCArtboard>
          </DCSection>

          <DCSection id="builder-v2" title="Paper Builder · workspace flow" subtitle="The core composition experience — a 3-panel workspace (Repository Browser / A4 paper canvas / Paper Insights). Six steps cover setup, empty state, composing live, a complete paper, full-bleed preview, and submit for approval.">
            <DCArtboard id="pb-v2-1" label="① Start · new paper setup" width={1440} height={900}>
              <PBV2Start />
            </DCArtboard>
            <DCArtboard id="pb-v2-2" label="② Empty · workspace, empty canvas" width={1440} height={1150}>
              <PBV2Empty />
            </DCArtboard>
            <DCArtboard id="pb-v2-3" label="③ Composing · question being added" width={1440} height={1200}>
              <PBV2Composing />
            </DCArtboard>
            <DCArtboard id="pb-v2-4" label="④ Complete · fully composed paper" width={1440} height={1500}>
              <PBV2Complete />
            </DCArtboard>
            <DCArtboard id="pb-v2-5" label="⑤ Preview · full-bleed paper" width={1440} height={1200}>
              <PBV2Preview />
            </DCArtboard>
            <DCArtboard id="pb-v2-6" label="⑥ Submit · approval modal" width={1440} height={1500}>
              <PBV2Submit />
            </DCArtboard>
          </DCSection>

          <DCSection id="blueprints" title="Blueprints · academic skeletons" subtitle="Blueprints define academic composition — sections, marks, syllabus weighting, difficulty mix. Six screens cover the workspace: library, detail view, and the 4-step authoring wizard.">
            <DCArtboard id="bp-library" label="① Library · default + custom blueprints" width={1440} height={1180}>
              <BPLibrary />
            </DCArtboard>
            <DCArtboard id="bp-detail" label="② Detail · Half-Yearly · CBSE X · Maths" width={1440} height={1400}>
              <BPDetail />
            </DCArtboard>
            <DCArtboard id="bp-create-1" label="③ Create · Step 1 · Basics" width={1440} height={1000}>
              <BPCreate1 />
            </DCArtboard>
            <DCArtboard id="bp-create-2" label="④ Create · Step 2 · Structure" width={1440} height={1100}>
              <BPCreate2 />
            </DCArtboard>
            <DCArtboard id="bp-create-3" label="⑤ Create · Step 3 · Syllabus weighting" width={1440} height={1200}>
              <BPCreate3 />
            </DCArtboard>
            <DCArtboard id="bp-create-4" label="⑥ Create · Step 4 · Review & save" width={1440} height={1300}>
              <BPCreate4 />
            </DCArtboard>
          </DCSection>

          <DCSection id="templates" title="Templates · visual identity" subtitle="Templates control how a paper looks when printed. Token-driven (logo, color, type, density, watermark) — never a free canvas. Four screens cover library, editor, picker sheet, and a custom template's detail page.">
            <DCArtboard id="tp-library" label="① Library · default + school templates" width={1440} height={1280}>
              <TPLibrary />
            </DCArtboard>
            <DCArtboard id="tp-editor" label="② Editor · token controls + live A4 preview" width={1440} height={1100}>
              <TPEditor />
            </DCArtboard>
            <DCArtboard id="tp-picker" label="③ Picker · apply template (sheet over Generate flow)" width={1440} height={1000}>
              <TPPicker />
            </DCArtboard>
            <DCArtboard id="tp-detail" label="④ Detail · Saraswati House Brand · custom template" width={1440} height={1200}>
              <TPDetail />
            </DCArtboard>
          </DCSection>

          <DCSection id="editor" title="Examination Editor · Format mode" subtitle="The dedicated editor route where a teacher refines layout, typography, spacing, and per-element overrides before submitting. 3-column workspace · live A4 paper canvas · Standard + Advanced modes · official preview strip. Eight workspace states and five overlay dialogs.">
            <DCArtboard id="pe-1" label="① Standard mode · nothing selected" width={1440} height={1000}>
              <PE1_Standard />
            </DCArtboard>
            <DCArtboard id="pe-2" label="② Standard · question selected (inline controls)" width={1440} height={1000}>
              <PE2_QuestionSelected />
            </DCArtboard>
            <DCArtboard id="pe-3" label="③ Standard · section selected" width={1440} height={1000}>
              <PE3_SectionSelected />
            </DCArtboard>
            <DCArtboard id="pe-4" label="④ Advanced mode · margin guides + all groups" width={1440} height={1000}>
              <PE4_Advanced />
            </DCArtboard>
            <DCArtboard id="pe-5" label="⑤ Advanced · question selected (floating toolbar + overrides)" width={1440} height={1000}>
              <PE5_AdvancedQuestionSelected />
            </DCArtboard>
            <DCArtboard id="pe-6" label="⑥ Preview surface · clean" width={1440} height={1000}>
              <PE6_PreviewSurface />
            </DCArtboard>
            <DCArtboard id="pe-7" label="⑦ Read-only · approved paper" width={1440} height={1000}>
              <PE7_ReadOnly />
            </DCArtboard>
            <DCArtboard id="pe-8" label="⑧ Print preview · export dropdown open" width={1440} height={1100}>
              <PE8_PrintPreview />
            </DCArtboard>
            <DCArtboard id="pe-9" label="⑨ Dialog · enable Advanced Layout" width={1440} height={1000}>
              <PE9_AdvancedConfirm />
            </DCArtboard>
            <DCArtboard id="pe-10" label="⑩ Toast · Smart fit results (with undo)" width={1440} height={1000}>
              <PE10_SmartFitToast />
            </DCArtboard>
            <DCArtboard id="pe-11" label="⑪ Dialog · reset question overrides" width={1440} height={1000}>
              <PE11_ResetConfirm />
            </DCArtboard>
            <DCArtboard id="pe-12" label="⑫ Dialog · unsaved changes" width={1440} height={1000}>
              <PE12_UnsavedDialog />
            </DCArtboard>
            <DCArtboard id="pe-13" label="⑬ Dialog · switch back to Standard" width={1440} height={1000}>
              <PE13_SwitchToStandard />
            </DCArtboard>
          </DCSection>

          <DCSection id="account" title="Account & Workspace Settings" subtitle="Profile, school identity, teacher management, notifications, preferences and security — the six screens that round out the workspace. Shared left-rail tab structure, one consistent settings page shell.">
            <DCArtboard id="ac-profile" label="① My Profile" width={1440} height={1300}>
              <ScreenProfile />
            </DCArtboard>
            <DCArtboard id="ac-school" label="② School / Workspace" width={1440} height={1400}>
              <ScreenSchool />
            </DCArtboard>
            <DCArtboard id="ac-teachers" label="③ Teacher Management" width={1440} height={1200}>
              <ScreenTeachers />
            </DCArtboard>
            <DCArtboard id="ac-notify" label="④ Notifications Center" width={1440} height={1200}>
              <ScreenNotifications />
            </DCArtboard>
            <DCArtboard id="ac-prefs" label="⑤ Preferences & Appearance" width={1440} height={1200}>
              <ScreenPreferences />
            </DCArtboard>
            <DCArtboard id="ac-security" label="⑥ Security & Sessions" width={1440} height={1500}>
              <ScreenSecurity />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel title="Tweaks">
          <TweakSection title="Paper Builder · canvas variation">
            <p style={{ fontSize: 12, color: 'rgba(60,50,40,0.65)', margin: '0 0 8px', lineHeight: 1.45 }}>
              Pick a layout for the A4 paper canvas in artboard ③. Each is a real published format used by Indian state-board schools.
            </p>
            <TweakRadio label="Layout" value={t.canvas} onChange={v => setTweak('canvas', v)}
              options={[
                { value: 'classic', label: 'Classic' },
                { value: 'editorial', label: 'Editorial' },
                { value: 'bilingual', label: 'Bilingual' },
              ]} />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
